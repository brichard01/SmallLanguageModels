<style>

function fill(colId, items, onSelect) {
  const col = document.getElementById(colId);
  const header = col.querySelector('.col-header');
  col.innerHTML = '';
  col.appendChild(header);
  if (!items || !items.length) {
    col.insertAdjacentHTML('beforeend', '<div class="empty">No entries</div>');
    return;
  }
  items.forEach(item => {
    const div = document.createElement('div');
    div.className = 'item';
    div.innerHTML = `<span class="code">${item.code}</span>${item.label}`;
    div.onclick = () => {
      col.querySelectorAll('.item').forEach(i => i.classList.remove('active'));
      div.classList.add('active');
      onSelect(item);
    };
    col.appendChild(div);
  });
}

// Sections
const sectionItems = DATA.sections.map(s => ({ code: s.section_letter + ' (' + s.section + ')', label: s.name, key: s.section_letter }));
fill('col-section', sectionItems.map(s => ({code: s.code, label: s.label})), (item, idx) => {});

// Re-do with proper click handlers
const secCol = document.getElementById('col-section');
const secHeader = secCol.querySelector('.col-header');
secCol.innerHTML = '';
secCol.appendChild(secHeader);
DATA.sections.forEach(s => {
  const div = document.createElement('div');
  div.className = 'item';
  div.innerHTML = `<span class="code">${s.section_letter}</span>${s.name}`;
  div.onclick = () => {
    secCol.querySelectorAll('.item').forEach(i => i.classList.remove('active'));
    div.classList.add('active');
    const chapters = DATA.hs[s.section_letter] || [];
    fill('col-chapter', chapters, chapter => {
      const headings = DATA.hs[chapter.code] || [];
      fill('col-heading', headings, heading => {
        const subs = DATA.hs[heading.code] || [];
        fill('col-sub', subs, () => {});
        if (!subs.length) {
          document.getElementById('col-sub').insertAdjacentHTML('beforeend', '<div class="empty">No subheadings</div>');
        }
      });
      if (!headings.length) {
        document.getElementById('col-heading').insertAdjacentHTML('beforeend', '<div class="empty">No headings</div>');
        document.getElementById('col-sub').innerHTML = document.getElementById('col-sub').querySelector('.col-header').outerHTML + '<div class="empty">← pick a heading</div>';
      }
    });
    document.getElementById('col-sub').innerHTML = document.getElementById('col-sub').querySelector('.col-header').outerHTML + '<div class="empty">← pick a heading</div>';
  };
  secCol.appendChild(div);
});
</script>
