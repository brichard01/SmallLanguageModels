# Build the distillation image with the repo root as context (to pull in
# training_methods/distill_generate.py, hscode_env.py and data/) while keeping
# the Dockerfile in google_gpu/. Invoked by submit_distill.sh from the repo root.
steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_IMAGE_URI}
      - -f
      - google_gpu/Dockerfile.distill
      - .
images:
  - ${_IMAGE_URI}
options:
  machineType: E2_HIGHCPU_8
timeout: 3000s
