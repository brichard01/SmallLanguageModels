# Build the evaluation image with the repo root as context (to pull in
# benchmarks/eval_vllm.py, hscode_env.py and data/) while keeping the Dockerfile
# in google_gpu/. Invoked by submit_eval.sh from the repo root.
steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_IMAGE_URI}
      - -f
      - google_gpu/Dockerfile.eval
      - .
images:
  - ${_IMAGE_URI}
options:
  machineType: E2_HIGHCPU_8
timeout: 3000s
